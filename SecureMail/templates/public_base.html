{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecuraMail{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'SecureMail/images/logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inject Global Design Tokens -->
    <link rel="stylesheet" href="{% static 'SecureMail/css/global.css' %}">
</head>
<body class="bg-[#F8FAFC] font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200 min-h-screen flex flex-col">

    <!-- Unified Public Navbar -->
    {% include "components/navbar.html" %}

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-20 px-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
