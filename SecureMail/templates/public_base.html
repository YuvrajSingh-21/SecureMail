{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Securamail — AI-Powered Email Security & Threat Detection{% endblock %}</title>
    <meta name="description" content="Securamail is an AI-powered email security platform that securely connects to your Gmail account to detect phishing, malicious emails, suspicious links, and potentially dangerous attachments. It analyzes email threats and provides security insights to help protect your inbox.">
    <link rel="canonical" href="https://securamail.me{{ request.path }}">
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://securamail.me{{ request.path }}">
    <meta property="og:title" content="Securamail — AI-Powered Email Security & Threat Detection">
    <meta property="og:description" content="Securamail is an AI-powered email security platform that securely connects to your Gmail account to detect phishing, malicious emails, suspicious links, and potentially dangerous attachments. It analyzes email threats and provides security insights to help protect your inbox.">
    <meta property="og:site_name" content="Securamail">
    
    <link rel="icon" type="image/png" href="{% static 'SecureMail/images/logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Inject Global Design Tokens -->
    <link rel="stylesheet" href="{% static 'SecureMail/css/global.css' %}">
</head>
<body class="bg-[#F8FAFC] font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200 min-h-screen flex flex-col">

    <!-- Unified Public Navbar -->
    {% include "components/navbar.html" %}

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-20 px-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
