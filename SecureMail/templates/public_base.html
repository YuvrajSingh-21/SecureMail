{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SecureMail{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'SecureMail/images/logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .gradient-text { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-bg { background: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%), radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent 40%); }
    </style>
</head>
<body class="bg-[#0b1120] text-gray-200 font-sans antialiased selection:bg-blue-500/30 selection:text-blue-200 min-h-screen gradient-bg flex flex-col">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 glass transition-all duration-300 shadow-xl">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <img src="{% static 'SecureMail/images/logo.png' %}" class="app-logo app-logo-sm" alt="SecureMail">
                </div>
                <span class="text-xl font-black text-white tracking-tight">SecureMail</span>
            </a>
            <div class="hidden md:flex items-center gap-8">
                <a href="/#features" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Features</a>
                <a href="/about/" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">About</a>
                <a href="/contact/" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Contact</a>
            </div>
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <a href="/inbox/" class="text-sm font-bold bg-white text-gray-900 hover:bg-gray-100 px-6 py-2.5 rounded-full transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">Dashboard</a>
                {% else %}
                    <a href="/register/" class="text-sm font-bold bg-white text-gray-900 hover:bg-gray-100 px-6 py-2.5 rounded-full transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">Connect Gmail</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-20 px-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    {% include "components/footer.html" %}

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
