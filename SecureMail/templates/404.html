{% extends "public_base.html" %}

{% block title %}404 - Page Not Found | Securamail{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto text-center py-16">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-red-50 text-red-600 mb-8 border border-red-100 shadow-sm">
        <i data-lucide="shield-alert" class="w-10 h-10"></i>
    </div>
    <h1 class="text-6xl font-black text-[var(--sys-text)] tracking-tight mb-4">404</h1>
    <h2 class="text-2xl font-bold text-[var(--sys-text)] mb-4">Page Not Found</h2>
    <p class="text-[var(--sys-text-secondary)] text-base leading-relaxed mb-8">
        The security resource or page you are trying to access does not exist or has been moved.
    </p>
    <div class="flex items-center justify-center gap-4">
        <a href="/" class="sys-btn-primary px-6 py-3 rounded-xl font-bold text-sm inline-flex items-center gap-2">
            <i data-lucide="home" class="w-4 h-4"></i> Return to Securamail Home
        </a>
    </div>
</div>
{% endblock %}
