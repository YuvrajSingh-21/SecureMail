<div class="bg-card/10 backdrop-blur-2xl border border-white/20 rounded-3xl p-{{ padding|default:"8" }} shadow-2xl shadow-black/50 shadow-[inset_0_1px_1px_rgba(255,255,255,0.2)] hover:bg-card/15 hover:border-white/30 transition-all duration-500 group {% if delay %}animate-slide-up delay-{{ delay }}{% endif %} {% if hover_up %}hover:-translate-y-2{% endif %} {% if center_text %}text-center{% endif %} {{ extra_classes }}">
 <div class="w-{{ icon_size|default:"14" }} h-{{ icon_size|default:"14" }} rounded-2xl bg-{{ color|default:'blue' }}-500/20 flex items-center justify-center mb-6 group-hover:scale-110 transition shadow-lg {% if center_icon %}mx-auto{% endif %}">
 <i data-lucide="{{ icon }}" class="w-{{ icon_inner|default:"7" }} h-{{ icon_inner|default:"7" }} text-{{ color|default:'blue' }}-400"></i>
 </div>
 <h3 class="text-white font-black text-xl mb-3 tracking-tight">{{ title }}</h3>
 <p class="text-muted-foreground text-sm font-medium leading-relaxed">{{ text }}</p>
</div>
