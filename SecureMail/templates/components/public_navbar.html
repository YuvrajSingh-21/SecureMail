{% load static %}
<nav class="fixed top-0 w-full z-50 glass transition-all duration-300 shadow-xl" style="background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="/" class="flex items-center gap-3">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                <img src="{% static 'SecureMail/images/logo.png' %}" class="app-logo app-logo-sm" alt="SecureMail">
            </div>
            <span class="text-xl font-black text-white tracking-tight">SecureMail</span>
        </a>
        <div class="hidden md:flex items-center gap-8">
            <a href="/#features" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Features</a>
            <a href="/about/" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">About</a>
            <a href="/contact/" class="text-sm font-semibold text-gray-400 hover:text-white transition-colors">Contact</a>
        </div>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <a href="/inbox/" class="text-sm font-bold bg-white text-gray-900 hover:bg-gray-100 px-6 py-2.5 rounded-full transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">Dashboard</a>
            {% else %}
                <a href="/register/" class="text-sm font-bold bg-white text-gray-900 hover:bg-gray-100 px-6 py-2.5 rounded-full transition-all shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:shadow-[0_0_30px_rgba(255,255,255,0.2)]">Connect Gmail</a>
            {% endif %}
        </div>
    </div>
</nav>
