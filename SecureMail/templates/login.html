{% extends "base.html" %}
{% load static %}

{% block title %}Authenticate — Securamail{% endblock %}

{% block content %}
    <div class="w-full min-h-full flex items-center justify-center p-6">
        <div class="w-full max-w-md animate-slide-up">
            <div class="text-center mb-8">
                <a href="{% url 'index' %}" class="inline-block mb-3">
                    <img src="{% static 'SecureMail/images/logo.png' %}" class="app-logo app-logo-lg" alt="Securamail">
                </a>
                <h1 class="text-2xl font-bold text-[var(--sys-text)] tracking-tight">Securamail</h1>
                <p class="text-[var(--sys-text-secondary)] text-sm mt-1">Intelligent Email Security & Threat Intelligence</p>
            </div>
            
            <div class="sys-card rounded-2xl p-8 shadow-2xl">
                <div class="space-y-4">
                    <a href="{% url 'google_login' %}" class="w-full flex items-center justify-center gap-3 px-6 py-3.5 rounded-xl bg-white hover:bg-gray-50 text-[var(--sys-text)] font-semibold border border-gray-200 transition shadow-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                        </svg>
                        Continue with Google
                    </a>
                </div>
                <div class="mt-6 pt-4 border-t border-[var(--sys-border)] text-center">
                    <p class="text-xs text-[var(--sys-text-secondary)]">
                        By continuing, you agree to Securamail's <a href="{% url 'terms' %}" class="text-[var(--sys-primary)] underline">Terms</a> and <a href="{% url 'privacy' %}" class="text-[var(--sys-primary)] underline">Privacy Policy</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
