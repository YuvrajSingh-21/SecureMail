# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - SecureMail

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: securemail
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
          
      - name: Run Django Tests
        env:
          TESTING: "True"
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIELD_ENCRYPTION_KEY: ${{ secrets.FIELD_ENCRYPTION_KEY }}
          DB_NAME: securemail
          DB_USER: user
          DB_PASSWORD: password
          DB_HOST: localhost
          DB_PORT: 5432
          GEMINI_API_KEY: "dummy-gemini-key"
          GOOGLE_API_KEY: "dummy-google-key"
          SAFE_BROWSING_API_KEY: "dummy-safebrowsing-key"
          VIRUSTOTAL_API_KEY: "dummy-virustotal-key"
          GOOGLE_CLIENT_ID: "dummy-client-id"
          GOOGLE_CLIENT_SECRET: "dummy-client-secret"
        run: |
          source antenv/bin/activate
          python manage.py collectstatic --noinput
          python manage.py test --noinput
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_070185D209574A5AA1DA0119C6AF51FB }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3A03B652CB124589835E8CB941A77682 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_04DD3364203C4B619A17ADD6859A5E0E }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'SecureMail'
          slot-name: 'Production'

      - name: Wait for Production Readiness
        run: |
          echo "Polling https://securamail.me until it returns HTTP 200..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://securamail.me/login/)
            if [ "$STATUS" -eq 200 ]; then
              echo "Production is ready!"
              exit 0
            fi
            echo "Status is $STATUS. Retrying in 10s..."
            sleep 10
          done
          echo "Production did not become ready in time."
          exit 1
